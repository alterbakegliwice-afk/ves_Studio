name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # --- structural validation ---
      - name: Validate sources
        run: python scripts/validate_sources.py

      - name: Validate dependencies
        run: python scripts/validate_dependencies.py

      # --- semantic policy stage ---
      - name: Validate registries (licenses, external truth, model pointer)
        run: python scripts/validate_registries.py

      - name: Validate policies (eligibility, decision sync, status, accounting)
        run: python scripts/validate_policies.py

      - name: Validate release docs (version / report / test-count coherence)
        run: python scripts/validate_release_docs.py

      - name: Detect duplicate rules (blocks unexempted normative duplicates)
        run: python scripts/detect_duplicate_rules.py

      # --- runtime checks: verify BEFORE build so a stale committed pack fails ---
      - name: Verify committed runtime is fresh
        run: python scripts/verify_runtime_freshness.py

      - name: Validate runtime
        run: python scripts/validate_runtime.py

      - name: Rebuild runtime and assert no diff
        run: |
          python scripts/build_runtime_pack.py
          git diff --exit-code -- runtime/

      - name: Run tests
        run: pytest -q
