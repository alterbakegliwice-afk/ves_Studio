name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate sources
        run: python scripts/validate_sources.py

      - name: Validate dependencies
        run: python scripts/validate_dependencies.py

      - name: Detect duplicate rules (report)
        run: python scripts/detect_duplicate_rules.py

      - name: Build runtime pack
        run: python scripts/build_runtime_pack.py

      - name: Validate runtime
        run: python scripts/validate_runtime.py

      - name: Run tests
        run: pytest -q
